name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test the library reactor (tests + JaCoCo)
        # clean install: compiles, runs all tests (including the Testcontainers
        # Redis integration tests), generates the JaCoCo report and installs the
        # artifacts so the examples can consume them. Docker is available on the
        # hosted runner. The enforcer pins JDK 9+ / Maven 3.9+.
        run: mvn -B -f rate-limit/pom.xml clean install

      - name: Build the examples against the installed artifacts
        run: mvn -B -f examples/pom.xml clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.java }}
          path: |
            rate-limit/rate-limit-core/target/site/jacoco
            rate-limit/rate-limit-inmemory/target/site/jacoco
            rate-limit/rate-limit-redis/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14