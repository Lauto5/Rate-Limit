name: gpg-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose GPG signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -u
          echo "gpg=$(gpg --version | head -1)"
          echo "PASS_LEN=${#GPG_PASSPHRASE}"
          echo "KEY_LEN=${#GPG_PRIVATE_KEY}"

          setup_home() {
            home="$RUNNER_TEMP/gpg-${1}"
            rm -rf "$home"; mkdir -m 700 "$home"; export GNUPGHOME="$home"
            printf '%s\n' 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
            printf '%s\n' 'allow-loopback-pinentry' 'max-cache-ttl 7200' > "$GNUPGHOME/gpg-agent.conf"
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import >/dev/null 2>&1
          }

          setup_home kid
          KEYID=$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '/^(sec|ssb)/{print $5; exit}')
          echo "KEYID=$KEYID"
          printf 'x' > /tmp/d.bin

          setup_home loopback
          if gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" --output /tmp/lb.sig --detach-sign /tmp/d.bin 2>&1; then
            echo "ATTEMPT[loopback]=OK"
          else
            echo "ATTEMPT[loopback]=FAIL"
          fi

          setup_home loopback-fd
          if printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$KEYID" --output /tmp/lbfd.sig --detach-sign /tmp/d.bin 2>&1; then
            echo "ATTEMPT[loopback-fd]=OK"
          else
            echo "ATTEMPT[loopback-fd]=FAIL"
          fi

          setup_home plain
          if printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$KEYID" --output /tmp/pl.sig --detach-sign /tmp/d.bin 2>&1 | tee -a "$RUNNER_TEMP/plain.log"; then
            echo "ATTEMPT[plain-fd]=OK"
          else
            echo "ATTEMPT[plain-fd]=FAIL (see log)"
          fi
          tail -3 "$RUNNER_TEMP/plain.log" 2>/dev/null | sed 's/^/  plain: /'