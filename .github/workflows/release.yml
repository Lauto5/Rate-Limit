name: Release

# Tag-driven release to Maven Central (Stage 8 of the publishing plan).
#
# A tag `vX.Y.Z` (e.g. v1.0.1, v1.1.0, v2.0.0) triggers the pipeline:
#   git tag -> GitHub Actions -> mvn -Ppublish clean deploy -> Maven Central
#
# This workflow ONLY runs on real release tags. Dry runs live in the separate
# 'release-dry-run.yml' workflow (workflow_dispatch, no production access).
#
# Secrets:
#   Repo-level (available to CI + dry-run + release):
#     GPG_SIGNING_KEY  ASCII-armored private key (public key distributed to the
#                      PGP keyservers supported by Central, e.g. keyserver.ubuntu.com)
#     GPG_PASSPHRASE   passphrase of the signing key (used once, to prime the gpg
#                      agent; signing itself happens via the agent's cache)
#   GitHub Environment "production" (release only, least privilege):
#     MAVEN_USERNAME   Central Portal user token username
#     MAVEN_PASSWORD   Central Portal user token password
#
# The version guard enforces SemVer and a strict tag == reactor <version> match
# (no SNAPSHOTs, no "forgetting to bump"). Nothing is published on a mismatch.

on:
  push:
    tags:
      # GitHub filter globs are NOT regex. This is intentionally broad
      # (vANY.ANY.ANY); strict SemVer validation lives in the workflow.
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }} to Maven Central
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install & prime GPG signing key
        id: gpg-prime
        env:
          # NOTE: these secrets are only ever written to the isolated GNUPGHOME
          # file. Never print them.
          GPG_PRIVATE_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME="$RUNNER_TEMP/gpg-home"
          rm -rf "$GNUPGHOME"
          mkdir -p -m 700 "$GNUPGHOME"
          export GNUPGHOME

          # Import FIRST: gpg 2.4's secret-key import self-checks the key and
          # would try to unlock it; with pinentry-mode loopback active it then
          # fails in --batch mode ("can't get input").
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

          printf '%s\n' 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
          printf '%s\n' \
            'allow-loopback-pinentry' \
            'default-cache-ttl 3600' \
            'max-cache-ttl 7200' > "$GNUPGHOME/gpg-agent.conf"

          KEYID=$(gpg --batch --with-colons --list-secret-keys 2>/dev/null \
            | awk -F: '/^(sec|ssb)/{print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "::error::No secret GPG key found. Check the GPG_SIGNING_KEY secret."
            exit 1
          fi

          # Prime the agent's cache with the passphrase. If the passphrase is
          # wrong this step fails loudly instead of surfacing deep in Maven.
          echo -n scratch > "$RUNNER_TEMP/gpg-prime.bin"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" --output "$RUNNER_TEMP/gpg-prime.sig" \
            --detach-sign "$RUNNER_TEMP/gpg-prime.bin"
          gpg --verify "$RUNNER_TEMP/gpg-prime.sig" "$RUNNER_TEMP/gpg-prime.bin"

          echo "keyid=$KEYID"
          echo "keyid=$KEYID" >> "$GITHUB_OUTPUT"
          # Reuse this isolated home in every later step (Maven signs against it
          # without any passphrase: the agent serves it from its cache).
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create Maven settings with Central credentials
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>__MAVEN_USERNAME__</username>
                <password>__MAVEN_PASSWORD__</password>
              </server>
            </servers>
          </settings>
          EOF
          sed -i \
              -e "s|__MAVEN_USERNAME__|$MAVEN_USERNAME|g" \
              -e "s|__MAVEN_PASSWORD__|$MAVEN_PASSWORD|g" \
              "$HOME/.m2/settings.xml"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Validate tag matches reactor version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag must be exactly vMAJOR.MINOR.PATCH (SemVer-clean, no SNAPSHOT).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a vMAJOR.MINOR.PATCH tag. Nothing was published."
            exit 1
          fi
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('rate-limit/pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(root.find('m:version', ns).text)
          PY
          )
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::The reactor version '$VERSION' is a SNAPSHOT; a release tag must point to a non-SNAPSHOT version. Nothing was published."
            exit 1
          fi
          EXPECTED="${TAG#v}"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match the reactor version '$VERSION'. Bump the version in rate-limit/pom.xml before tagging the release."
            echo "::error::Expected '$EXPECTED'; found '$VERSION'. Nothing was published."
            exit 1
          fi
          echo "Tag '$TAG' matches reactor version '$VERSION' (ok)."

      - name: Deploy to Maven Central
        run: |
          echo "== Publishing $GITHUB_REF_NAME (auto-publish, wait until PUBLISHED) =="
          mvn -B -f rate-limit/pom.xml -Ppublish clean deploy \
            -Dgpg.keyname="$KEYID" \
            -Dcentral.autoPublish=true -Dcentral.waitUntil=published
        env:
          KEYID: ${{ steps.gpg-prime.outputs.keyid }}
          # No GPG passphrase here: Maven signs against the isolated GNUPGHOME
          # whose agent (primed above) serves the passphrase from its cache.
          # GNUPGHOME itself is set for every step via GITHUB_ENV.
          GITHUB_REF_NAME: ${{ github.ref_name }}